<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save the Sunshine Playroom</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--co:#FF6B6B;--te:#4ECDC4;--or:#FF9F43;--ye:#FFD93D;--vi:#C77DFF;--gr:#6BCB77;--ink:#2D3436}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:#FEF9F0;color:var(--ink);min-height:100vh}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:20px;margin-bottom:14px}
h1,h2,h3{font-weight:900}
.b{border:0;border-radius:30px;padding:10px 22px;font:800 15px Nunito,sans-serif;color:#fff;background:var(--co);cursor:pointer}
.b.t{background:var(--te);color:#073B37}.b.g{background:#EEE;color:#555}.b.o{background:var(--or);color:#4A2A00}
.b:disabled{opacity:.4;cursor:not-allowed}
input{font:700 15px Nunito,sans-serif;border:2px solid #E8DFCC;border-radius:12px;padding:10px 12px;width:100%}
input:focus{outline:0;border-color:var(--te)}
.hd{position:sticky;top:0;background:#FEF9F0;padding:10px 16px;display:flex;align-items:center;gap:6px;z-index:5;border-bottom:1px solid #F1E7D3}
.dt{width:30px;height:30px;border-radius:50%;background:#E8E0D0;display:flex;align-items:center;justify-content:center;font-size:14px}
.dt.d{background:var(--gr)}.dt.a{background:var(--or)}
.ln{flex:1;height:3px;background:#E8E0D0;max-width:40px}
.pill{margin-left:auto;background:var(--or);color:#4A2A00;font-weight:800;padding:5px 14px;border-radius:20px;font-size:14px;white-space:nowrap}
.o{display:block;width:100%;text-align:left;border:2px solid #EEE;border-radius:12px;padding:10px 12px;margin-top:6px;background:#fff;font:700 14px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
.o.s{border-color:var(--te);background:#E8F9F7}.o.ok{border-color:var(--gr);background:#EAF8EC}.o.ko{border-color:var(--co);background:#FFECEC}
.q{margin-bottom:18px}.ban{background:#FFF3DC;border:2px solid var(--or);border-radius:12px;padding:10px;font-weight:800;font-size:14px;margin-bottom:12px}
.gn{background:#EAF8EC;border:2px solid var(--gr);border-radius:12px;padding:12px;margin-top:10px;font-weight:700;font-size:14px}
.rep{position:fixed;left:12px;bottom:12px;z-index:6}
.ft{text-align:center;color:#999;font-size:13px;padding:16px}.ft a{color:var(--co);font-weight:800;cursor:pointer}
.ch{display:inline-block;background:var(--te);color:#073B37;font-weight:800;border-radius:20px;padding:2px 10px;margin:2px;font-size:13px}
.wd{display:inline-block;background:var(--vi);color:#fff;font-weight:900;border-radius:30px;padding:6px 16px;margin:3px}
#toast{position:fixed;right:12px;bottom:12px;background:var(--gr);color:#fff;font-weight:800;padding:6px 14px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:9}
#rpt{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid #EEE;text-align:left}
@media print{body>*{display:none!important}#rpt{display:block!important;padding:10px}}
</style></head><body>
<div id="app"></div><div id="rpt"></div><div id="toast">💾 Sauvegardé</div>
<script>
const WW=['WE','PLAY','AND','LEARN','TOGETHER'],SC='AEPA',TC='0504';
/* Mission 1 — 3 lots (1 par tentative) */
const M1=[
[['Toy','An object to play with'],['Nursery','A place for young children'],['Routine','A regular daily schedule'],['Assist','To help someone'],['Toddler','A child between 1 and 3 years old'],['Story time','Time to listen to a story'],['Playground','An outdoor area to play'],['Painting','A creative activity with colours and a brush'],['Snack','A small amount of food between meals'],['Nap','A short sleep during the day']],
[['Lullaby','A song to help a child sleep'],['Clap','To hit your hands together'],['Circle time','A time to sit and talk in a group'],['Creative','Good at making new things'],['Nursery rhyme','A short poem or song for children'],['Gentle','Soft and kind in your actions'],['Sing','To make music with your voice'],['Imagination','The ability to create new ideas in your mind'],['Kind','Nice and caring to others'],['Comfort','To make someone feel better when sad']],
[['Craft','An activity where you make something with your hands'],['Bandage','A strip of cloth put on a small wound'],['Share','To let another person use something with you'],['Lunchtime','The time of day when children eat their meal'],['Safe','Not in danger and protected from harm'],['Tidy up','To put toys and objects back in their place'],['Parent',"A child's mother or father"],['Pretend','To act as if something imaginary is real'],['Wait','To stay in a place until something happens'],['Hug','To hold someone in your arms to show you care']]];
let S={scr:'home',m:1,tn:'',pl:[],pts:0,rv:[],res:[],all:[],att:1,sh:[],t0:0},E={},F={np:1,m:[['','']]};
const $=id=>document.getElementById(id),shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const key=n=>'sunshine_v3_'+n.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
const bt=(t,f,c='',x='')=>`<button class="b ${c}" ${x} onclick="${f}">${t}</button>`;
function save(){try{if(S.tn&&S.t0){S.savedAt=Date.now();localStorage.setItem(key(S.tn),JSON.stringify(S));let t=$('toast');t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}}catch(e){}}
function load(n){try{return JSON.parse(localStorage.getItem(key(n)))}catch(e){return null}}
function go(s,e){E=e||{};S.scr=s;if(['m1i','m1q','m1d'].includes(s)&&s!=='m1d')S.safe=s==='m1q'?'m1i':s;if(s==='m1d')S.safe='m1d';save();render();scrollTo(0,0)}
function render(){const g=S.t0&&!['home','rules','rgpd','tlg','tdb','slg','grp'].includes(S.scr);
$('app').innerHTML=(g?hdr():'')+'<div class="w">'+view()+'</div>'+(g?`<div class="rep">${bt('📄 PDF','openPDF()','o')}</div>`:'')+(['home','rules','rgpd'].includes(S.scr)?'':foot())+(S.scr==='home'?foot():'')}
function foot(){return S.scr==='home'?`<div class="ft">Créé par C. Iemfre | <a onclick="go('rgpd')">🔒 RGPD</a></div>`:`<div class="ft">Créé par C. Iemfre | <a onclick="go('rgpd')">🔒 RGPD</a></div>`}
function hdr(){let ic=['📝','📖','🎤','🔗','📋'];return`<div class="hd">${ic.map((e,i)=>(i?'<div class="ln"></div>':'')+`<div class="dt ${i+1<S.m?'d':i+1===S.m?'a':''}">${i+1<S.m?'✓':e}</div>`).join('')}<div class="pill">⭐ ${S.pts} pts</div></div>`}
const intro=(e,t,s,d,f)=>`<div class="c"><div style="text-align:center;font-size:44px">${e}</div><h2 style="text-align:center;color:var(--co);margin:6px 0">${t}</h2><p style="text-align:center;font-weight:800;color:var(--te);margin-bottom:12px">${s}</p><p style="line-height:1.6;margin-bottom:16px">${d}</p><div style="text-align:center">${bt('Lancer la mission',f)}</div></div>`;
function view(){const s=S.scr;
if(s==='home')return`<div style="text-align:center;padding:40px 0 10px"><div style="font-size:54px">🌈</div><h1 style="font-size:32px;color:var(--co)">Save the Sunshine Playroom</h1><p style="font-weight:800;color:var(--te);margin:6px 0 4px">English Escape Game</p><p style="color:#888;margin-bottom:26px">Bac Pro 2nde AEPA</p><div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><div class="c" style="width:230px"><h3 style="color:var(--te)">Espace élèves</h3><p style="color:#888;font-size:14px;margin:6px 0 14px">Rejoindre la mission</p>${bt('C\'est parti','go(\'rules\')','t')}</div><div class="c" style="width:230px"><h3 style="color:var(--or)">Espace prof</h3><p style="color:#888;font-size:14px;margin:6px 0 14px">Codes et contenus</p>${bt('Accès prof','go(\'tlg\')','o')}</div></div></div>`;
if(s==='rules')return`<div class="c"><h2 style="color:var(--co)">Mission briefing</h2><p style="line-height:1.7;margin:10px 0">Lundi matin. Le Sunshine Playroom est en danger ! Les fichiers d'activités sont perdus. Le planning a disparu. Dix enfants attendent devant la porte. Votre équipe est la nouvelle équipe d'animation. Complétez les 5 missions pour trouver les 5 mots secrets. Recomposez la phrase, entrez le Master Code et sauvez le Sunshine Playroom !</p><p style="line-height:1.8;font-size:14px">⭐ +50 pts si la mission est réussie dès la 1re tentative (≥ 80 %), +30 pts à la 2e (≥ 70 %).<br>🔁 3 tentatives par exercice, avec un contenu différent à chaque fois. Rien ne vous bloque jamais.<br>🎤 Oral : le professeur annonce une note sur 10 que vous saisissez.<br>📄 Le rapport PDF est disponible à tout moment.<br>💾 Votre progression est sauvegardée sur cette tablette.</p><div style="margin-top:16px;display:flex;gap:10px">${bt('Accepter la mission','go(\'slg\')','t')}${bt('Retour','go(\'home\')','g')}</div></div>`;
if(s==='rgpd')return`<div class="c"><h2 style="color:var(--co)">🔒 Protection des données personnelles</h2><p style="line-height:1.7;margin:10px 0">Cette application est un outil pédagogique développé pour un usage en classe.</p><ul style="line-height:1.7;padding-left:20px"><li>Aucune donnée n'est transmise à un serveur externe : toutes les informations (identifiant, réponses, score) restent uniquement dans la mémoire de votre navigateur.</li><li>Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.</li><li>Les seules données saisies sont : les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices.</li><li>Ces données sauvegardées en stockage local uniquement (sur la tablette utilisée par l’élève uniquement).</li><li>Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur.</li></ul><div style="margin-top:14px">${bt('Retour','go(S.t0?S.scr==="rgpd"?"home":S.scr:"home")','g')}</div></div>`;
if(s==='tlg'||s==='slg'){const t=s==='tlg';return`<div class="c" style="max-width:380px;margin:40px auto"><h2 style="color:${t?'var(--or)':'var(--te)'};margin-bottom:12px">${t?'Espace prof':'Connexion élèves'}</h2><input id="cd" type="password" placeholder="Code d'accès" onkeydown="if(event.key==='Enter')login('${s}')"><p id="er" style="color:var(--co);font-weight:800;font-size:13px;min-height:20px"></p><div style="display:flex;gap:10px">${bt('Accéder','login(\''+s+'\')','t')}${bt('Retour','go(\'home\')','g')}</div></div>`}
if(s==='tdb')return`<div class="c"><h2 style="color:var(--or)">Espace prof</h2><p style="margin:8px 0"><b>Code élèves :</b> <span class="ch" style="font-size:16px">${SC}</span></p><p style="font-size:13px;color:#888">Master code : WE PLAY AND LEARN TOGETHER</p></div><div class="c"><h3 style="color:var(--co);margin-bottom:8px">Mission 1 — Induction Room (QCM)</h3>${M1.map((l,i)=>`<p style="font-weight:800;margin-top:8px">Tentative ${i+1}</p><p style="font-size:13px;line-height:1.6">${l.map(x=>`<b>${x[0]}</b> : ${x[1]}`).join('<br>')}</p>`).join('')}</div><div class="c" style="font-size:14px;color:#888">Missions 2 à 5 : contenus ajoutés aux prochaines étapes de construction.</div>${bt('Retour','go(\'home\')','g')}`;
if(s==='grp'){const n=F.np,ex=F.tn&&load(F.tn);return`<div class="c"><h2 style="color:var(--te);margin-bottom:10px">Identification équipe</h2><label style="font-weight:800;font-size:14px">Nom de l'équipe</label><input id="tn" value="${F.tn||''}" oninput="F.tn=this.value;chk()" style="margin:6px 0 8px"><div id="sv">${sv(ex)}</div><label style="font-weight:800;font-size:14px;display:block;margin-top:10px">Participants (${n}/4) : 2 lettres du prénom, 2 lettres du nom</label>${F.m.map((p,i)=>`<div style="display:flex;gap:8px;margin-top:6px"><input placeholder="JO" maxlength="2" value="${p[0]}" oninput="mem(${i},0,this)" style="text-align:center"><input placeholder="SM" maxlength="2" value="${p[1]}" oninput="mem(${i},1,this)" style="text-align:center">${n>1?bt('×',`F.m.splice(${i},1);F.np--;render()`,'g'):''}</div>`).join('')}${n<4?`<div style="margin-top:8px">${bt('+ Ajouter un membre','F.m.push([\'\',\'\']);F.np++;render()','g')}</div>`:''}<p id="er" style="color:var(--co);font-weight:800;font-size:13px;min-height:20px;margin-top:8px"></p>${bt('Lancer la mission','newGame()','t')}</div>`}
if(s==='m1i')return intro('📝','Mission 1 — Induction Room','Vocabulaire de l\'animation','Avant d\'entrer dans la salle, prouvez que vous maîtrisez le vocabulaire de l\'animation. 10 questions : pour chaque mot, choisissez la bonne définition. Seuil : 80 % à la 1re tentative, 70 % à la 2e. 3 tentatives possibles, aucun blocage.','startM1()');
if(s==='m1q')return qz();
if(s==='m1d'){const w=S.sh[0];return`<div class="c" style="text-align:center;background:var(--te);color:#073B37"><p style="font-weight:800">Mot secret découvert</p><div style="font-size:38px;font-weight:900;letter-spacing:2px">${w}</div><p style="font-size:13px">Notez ce mot : les 5 forment une phrase.</p></div><div class="c"><h3>🧩 Collection (${S.rv.length}/5)</h3><div style="margin:8px 0">${S.rv.map(x=>`<span class="wd">${x}</span>`).join('')}</div><p style="font-size:13px;color:#888">Les fragments sont dans le désordre.</p></div><div style="text-align:center">${bt('Mission suivante','nextM()')}</div>`}
if(s==='m2i')return`<div class="c"><h2>🔧 Mission ${S.m}</h2><p style="margin-top:8px">Cette mission sera ajoutée à la prochaine étape de construction.</p></div>`;
return'<p>Écran inconnu</p>'}
function sv(x){return x?`<div class="gn">🔄 Progression retrouvée : mission ${x.m}, ${x.pts} pts, sauvegardée le ${new Date(x.savedAt).toLocaleString('fr-FR')}<div style="margin-top:8px;display:flex;gap:8px">${bt('▶ Reprendre','resume()','t')}${bt('🆕 Recommencer à zéro','reset()','g')}</div></div>`:''}
function chk(){const e=$('sv');if(e)e.innerHTML=sv(F.tn&&load(F.tn))}
function mem(i,j,el){el.value=el.value.replace(/[^a-zA-Z]/g,'').toUpperCase();F.m[i][j]=el.value}
function login(s){const v=($('cd')||{}).value||'';if(v.toUpperCase()===(s==='tlg'?TC:SC)){go(s==='tlg'?'tdb':'grp')}else $('er').textContent='Code incorrect. Réessayez.'}
function resume(){const x=load(F.tn);if(!x)return;S=x;F={np:1,m:[['','']]};go(S.safe||'m1i')}
function reset(){if(!confirm('Effacer la progression de cette équipe ?'))return;try{localStorage.removeItem(key(F.tn))}catch(e){}chk()}
function newGame(){const n=(F.tn||'').trim();if(!n)return $('er').textContent="Entrez le nom de l'équipe";
for(const p of F.m)if(p[0].length<2||p[1].length<2)return $('er').textContent='Complétez les 2 lettres du prénom et du nom de chaque participant';
if(load(n)&&!confirm('Une progression existe déjà pour cette équipe. La remplacer ?'))return;
S={scr:'m1i',m:1,tn:n,pl:F.m.map(p=>({f:p[0],l:p[1]})),pts:0,rv:[],res:[],all:[],att:1,sh:shuf(WW),t0:Date.now()};F={np:1,m:[['','']]};go('m1i')}
function startM1(){S.att=1;S.t0=S.t0||Date.now();att1(0)}
function att1(i,b){const lot=M1[i];E={qs:lot.map((x,j)=>{const o=shuf([x[1],...shuf(lot.filter((_,k)=>k!==j)).slice(0,3).map(y=>y[1])]);return{w:x[0],o,c:o.indexOf(x[1])}}),a:{},done:false,b};S.scr='m1q';save();render();scrollTo(0,0)}
function qz(){const q=E.qs,n=Object.keys(E.a).length,sc=q.filter((x,i)=>E.a[i]===x.c).length;
return`<div class="c">${E.b||''}<h3 style="margin-bottom:12px">Tentative ${S.att} — Vocabulaire</h3>${q.map((x,i)=>`<div class="q"><p style="font-weight:800">${i+1}. What does "${x.w}" mean?</p>${x.o.map((o,j)=>`<button class="o ${E.done?(j===x.c?'ok':E.a[i]===j?'ko':''):E.a[i]===j?'s':''}" onclick="pk(${i},${j})">${o}${E.done&&j===x.c?' ✓':''}</button>`).join('')}</div>`).join('')}${E.done?`<div class="gn">${sc}/${q.length} bonnes réponses</div><div style="margin-top:10px">${bt('Continuer','finM1()')}</div>`:bt('Valider mes réponses','E.done=true;render()','',n<q.length?'disabled':'')}</div>`}
function pk(i,j){if(E.done)return;E.a[i]=j;render()}
function finM1(){const q=E.qs,t=q.length,sc=q.filter((x,i)=>E.a[i]===x.c).length,a=S.att;
q.forEach((x,i)=>S.all.push({m:'M1',att:a,q:`What does "${x.w}" mean?`,g:x.o[E.a[i]],c:x.o[x.c],ok:E.a[i]===x.c}));
const ok=a===1?sc>=0.8*t:a===2?sc>=0.7*t:true,p=a===1?(ok?50:-10):a===2?(ok?30:-15):Math.round(sc/t*20);
S.pts+=p;S.res.push({k:'Mission 1 — Vocabulaire',att:a,s:`${sc}/${t}`,ok:a<3?ok:sc>=0.5*t,p});
if(ok){go('m1d')}else{S.att++;att1(S.att-1,`<div class="ban">💪 Tentative ${a} : ${sc}/${t}. Pas de panique, voici de nouveaux mots !</div>`)}}
function nextM(){S.m++;S.att=1;go('m2i')}
function openPDF(){const d=S.all,w=d.filter(x=>!x.ok);
$('rpt').innerHTML=`<h1 style="color:#FF6B6B">Save the Sunshine Playroom — Rapport</h1><p><b>Équipe :</b> ${S.tn} ${S.pl.map(p=>`<span class="ch">${p.f}-${p.l}</span>`).join('')}</p><p><b>Score :</b> ${S.pts} pts · <b>Mission en cours :</b> ${S.m}/5 · ${new Date().toLocaleDateString('fr-FR')}</p><h3 style="margin-top:14px">Résultats par exercice</h3><table><tr><th>Exercice</th><th>Tentative</th><th>Score</th><th>Résultat</th><th>Points</th></tr>${S.res.map(r=>`<tr><td>${r.k}</td><td>${r.att}</td><td>${r.s}</td><td>${r.ok?'✅':'❌'}</td><td>${r.p>0?'+':''}${r.p}</td></tr>`).join('')}</table><h3 style="margin-top:14px">Détail des réponses</h3><table><tr><th>Question</th><th>Réponse donnée</th><th>Réponse correcte</th><th></th></tr>${d.map(x=>`<tr><td>${x.q} (T${x.att})</td><td>${x.g||'—'}</td><td>${x.c}</td><td>${x.ok?'✅':'❌'}</td></tr>`).join('')}</table><h3 style="margin-top:14px">Pour progresser</h3><p>${w.length?'À revoir : '+[...new Set(w.map(x=>x.q.replace(/^What does "|" mean\?$/g,'')))].join(', ')+'. Relisez ces mots avant de rejouer.':'Aucune erreur pour le moment, bravo !'}</p><p style="margin-top:14px;color:#999">Créé par C. Iemfre · Bac Pro AEPA</p>`;print()}
render();
</script>
<script>
const VF=[
{n:'Monday morning',t:`Today is Monday. It is 9 o'clock. The children arrive at the Sunshine Playroom. There are ten children, aged 3 to 5. The activity leader, Emma, says: "Good morning, everyone!" The children sit in a circle. Emma reads a story about a little bear. The children listen and look at the pictures.<br><br>After the story, it is craft time. The children paint with red, blue, and yellow paint. Tom paints a sun. Lea paints a flower. Emma helps the children who need help.<br><br>At 12 o'clock, it is lunchtime. The children eat sandwiches and fruit. After lunch, it is nap time. The children rest for 30 minutes.`,
s:[["Nous sommes mardi.",0],["Il y a dix enfants à la ludothèque.",1],["Les enfants ont entre 3 et 5 ans.",1],["Emma lit une histoire sur un chien.",0],["Emma est l'animatrice.",1],["Après l'histoire, les enfants jouent au football.",0],["Les enfants utilisent trois couleurs.",1],["Tom peint une fleur.",0],["Le déjeuner est à midi.",1],["Après le déjeuner, les enfants jouent dehors.",0]]},
{n:'Music and garden',t:`It is 2 o'clock. The children wake up after their nap. The activity leader, Marc, prepares a music session. He has a guitar, a tambourine, and some maracas. The children sit in a circle. Marc plays the guitar. The children sing a song about animals: a dog, a cat, and a duck. They clap their hands and dance.<br><br>After the session, it is snack time. The children eat apples and biscuits. They drink water or orange juice. At 4 o'clock, the children play in the garden. At 5 o'clock, parents come to collect them.`,

{n:'A rainy day',t:`It is Friday morning. It is raining, so the children cannot play outside. There are eight children at the Sunshine Playroom today. The activity leader, Sara, has a new idea: a puppet show. She takes four puppets from a big box: a rabbit, a lion, a frog, and a bird.<br><br>The children sit on the carpet. Sara tells a short story with the puppets. Then the children make their own puppets with paper, glue, and crayons. Ben makes a green frog. Mia makes a yellow bird.<br><br>At 11 o'clock, the children show their puppets to the group. Everyone claps. Sara takes a photo of the children for the parents. At 12 o'clock, it is lunchtime.`,
