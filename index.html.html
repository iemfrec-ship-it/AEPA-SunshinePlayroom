<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌟 Save the Sunshine Playroom</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#FEF9F0;min-height:100vh}
/* ── Layout ── */
.page{max-width:780px;margin:0 auto;padding:14px 16px 36px}
.card{background:#fff;border-radius:16px;box-shadow:0 3px 16px rgba(0,0,0,.07);padding:20px;margin-bottom:12px}
/* ── Header ── */
.hdr{background:#fff;border-bottom:2px solid #F0F0F0;padding:9px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hdr-in{max-width:780px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
/* ── Progress dots ── */
.prg{display:flex;align-items:center;flex:1}
.pd{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:800;flex-shrink:0;transition:all .25s}
.pd-done{background:#6BCB77;color:#fff}
.pd-cur{background:#FFD93D;color:#333;box-shadow:0 0 0 3px #FFF3B0;animation:pls .9s ease-in-out infinite}
.pd-wait{background:#E8E8E8;color:#BBB}
.pl{flex:1;height:3px;margin:0 2px;transition:background .25s}
.plbl{font-size:.55rem;font-weight:700;color:#AAA;text-align:center;margin-top:2px}
/* ── Buttons ── */
.btn{border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;border-radius:50px;padding:10px 20px;font-size:.87rem;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s;text-align:center;justify-content:center}
.btn:active{transform:scale(.96)!important}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-coral{background:#FF6B6B;color:#fff;box-shadow:0 3px 0 #B33030}
.b-coral:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #B33030}
.b-teal{background:#4ECDC4;color:#fff;box-shadow:0 3px 0 #259088}
.b-teal:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #259088}
.b-yellow{background:#FFD93D;color:#333;box-shadow:0 3px 0 #B8960A}
.b-yellow:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #B8960A}
.b-green{background:#6BCB77;color:#fff;box-shadow:0 3px 0 #35823F}
.b-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #35823F}
.b-purple{background:#C77DFF;color:#fff;box-shadow:0 3px 0 #7A33CC}
.b-purple:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #7A33CC}
.b-orange{background:#FF9F43;color:#fff;box-shadow:0 3px 0 #B86010}
.b-orange:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #B86010}
.b-gray{background:#E0E0E0;color:#555}.b-gray:hover:not(:disabled){background:#CCC}
.b-full{width:100%}.b-sm{font-size:.78rem;padding:7px 14px}
.b-lg{font-size:.97rem;padding:12px 28px}
/* ── Form ── */
input,select{font-family:'Nunito',sans-serif;border:2px solid #E8E8E8;border-radius:10px;padding:10px 13px;font-size:.9rem;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:#4ECDC4;box-shadow:0 0 0 3px rgba(78,205,196,.15)}
/* ── QCM ── */
.opt{display:flex;align-items:center;gap:8px;padding:10px 13px;border:2px solid #E8E8E8;border-radius:11px;margin-bottom:7px;cursor:pointer;font-weight:600;font-size:.88rem;transition:all .14s}
.opt:hover{border-color:#4ECDC4;background:#F0FFFE}
.opt-sel{border-color:#4ECDC4!important;background:#E5F9F8!important}
.opt-right{border-color:#6BCB77!important;background:#EDF9EF!important}
.opt-wrong{border-color:#FF6B6B!important;background:#FFF0F0!important}
.let{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;flex-shrink:0}
/* ── V/F ── */
.vfr{display:flex;align-items:center;gap:7px;padding:9px 11px;border:2px solid #E8E8E8;border-radius:11px;margin-bottom:7px;transition:all .14s;flex-wrap:wrap}
.tvf{padding:5px 12px;border-radius:50px;border:2px solid;cursor:pointer;font-weight:700;font-size:.79rem;font-family:'Nunito',sans-serif;transition:all .14s}
/* ── Matching ── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:9px 11px;border:2px solid #E8E8E8;border-radius:10px;cursor:pointer;font-weight:600;font-size:.83rem;min-height:48px;display:flex;align-items:center;transition:all .14s;line-height:1.35}
.mi:hover:not(.mu):not(.mok):not(.mko){border-color:#C77DFF;background:#F9F0FF}
.mi-sel{border-color:#C77DFF!important;background:#F3E8FF!important;box-shadow:0 0 0 3px rgba(199,125,255,.15)!important}
.mi.mu{opacity:.4;cursor:default;border-style:dashed}
.mi.mok{border-color:#6BCB77!important;background:#EDF9EF!important;cursor:default}
.mi.mko{border-color:#FF6B6B!important;background:#FFF0F0!important;cursor:default}
/* ── Reading text ── */
.rtxt{background:#FFF8EE;border-left:4px solid #FF9F43;padding:14px 16px;border-radius:0 12px 12px 0;font-size:.87rem;line-height:1.82;margin-bottom:13px}
/* ── Situation ── */
.sit{background:linear-gradient(135deg,#EBF5FB,#EDF8F0);border:2px solid #4ECDC4;border-radius:14px;padding:16px}
.slbl{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#4ECDC4;margin-bottom:2px}
.sval{font-weight:600;font-size:.9rem;margin-bottom:10px;line-height:1.5}
.hint{background:#FFF8E1;border:2px dashed #FFD93D;border-radius:10px;padding:9px 12px;font-size:.83rem;font-weight:700;color:#7A5700}
/* ── Indice ── */
.ibx{background:linear-gradient(135deg,#FF9F43,#FF6B6B);border-radius:18px;padding:24px;text-align:center;margin-bottom:12px}
.iwd{font-size:2.4rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.12)}
/* ── Score pill ── */
.scpill{background:linear-gradient(135deg,#FFD93D,#FF9F43);color:#fff;padding:5px 14px;border-radius:50px;font-weight:800;font-size:.86rem;white-space:nowrap;box-shadow:0 2px 8px rgba(255,159,67,.3)}
/* ── Banners ── */
.ok{background:#EDF9EF;border:2px solid #6BCB77;border-radius:11px;padding:11px;font-weight:700;color:#1A7A27;font-size:.87rem}
.ko{background:#FFF0F0;border:2px solid #FF6B6B;border-radius:11px;padding:11px;font-weight:700;color:#9A2020;font-size:.87rem}
.resume-box{background:linear-gradient(135deg,#E5F9F8,#FFF8EE);border:2px solid #4ECDC4;border-radius:14px;padding:16px;margin-bottom:14px}
/* ── Chip ── */
.chip{background:#4ECDC4;color:#fff;padding:3px 10px;border-radius:50px;font-weight:700;font-size:.77rem;display:inline-block;margin:2px}
/* ── Animations ── */
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fadein{animation:fadein .3s ease-out}
/* ── Print ── */
@media print{
  .noprint{display:none!important}
  body{background:#fff}
  .hdr{display:none}
  .page{padding:0}
  .card{box-shadow:none;border:1px solid #EEE}
}
@media(max-width:540px){.mg{grid-template-columns:1fr}.card{padding:15px;border-radius:12px}.iwd{font-size:1.8rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>

  {e:'🎨',t:'Situation Card #1',w:'Sunshine Playroom — Art corner',who:"Leo, 4 years old. He is sad and doesn't want to paint. He wants to go home.",r:'Activity leader. Talk to Leo. Help him feel better and join the group.',h:'💡 Think about: his feelings / what you can offer / how you bring him into the activity.'},

];

  {e:'🩹',t:'Incident Report #1',i:'Play area — Monday 10:30',x:"Tom (5) falls in the play area. He hurts his knee. The activity leader goes to Tom immediately. She cleans his knee and puts a bandage on it. Tom feels better after 5 minutes. His mother is called at 10:45. She arrives at 11:30. Tom goes home. The incident is recorded.",h:'💡 Cover: who / what happened / when / actions taken / result.'},
  {e:'🧸',t:'Incident Report #2 — Rattrapage',i:'Garden — Monday 14:30',x:"Lea (4) and Nora (4) argue. Lea takes Nora's ball. Nora cries. The activity leader comes and speaks calmly to both children. Lea says sorry. The activity leader gives Nora a new ball. They play together again.",h:'💡 Cover: who / what happened / what the activity leader did / final result.'},
  {e:'🎨',t:'Incident Report #3 — 2e Rattrapage',i:'Classroom — Monday 15:00',x:"During craft time, Sam (3) puts paint in his mouth. The activity leader sees this. She takes the paint and checks his mouth. The paint is not dangerous. She contacts Sam's parents. Sam drinks water and continues. The parents are not worried.",h:'💡 Cover: what happened / immediate action / child safe / parents informed.'}
];
const WW=['WE','PLAY','AND','LEARN','TOGETHER'];

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
let S={
  scr:'home',tc:'0504',sc:'2AEPA2627',
  g:{n:'',p:[]},np:1,
  pts:0,sh:[],rv:[],res:{},wr:[],allAns:[],
  t0:null,t1:null,l2s1:null,l3i:0,l5i:0,
  prevScr:null
};
let E={};
let F={};

/* ═══════════════════════════════════
   UTILS
═══════════════════════════════════ */
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
const pass=(n,t=10)=>n>=t*.8;
const fmt=(s,e)=>{if(!s||!e)return'—';const d=Math.round((e-s)/1e3);return`${0|d/60}min ${d%60}s`;};
const now=()=>new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});

/* ═══════════════════════════════════
   LOCALSTORAGE
═══════════════════════════════════ */
function lsKey(name){return'sunshine_v2_'+name.trim().toLowerCase().replace(/\s+/g,'_');}

function saveGame(){
  if(!S.g||!S.g.n)return;
  const safe={
    scr:safeScr(S.scr),g:S.g,pts:S.pts,
    sh:S.sh,rv:S.rv,res:S.res,wr:S.wr,
    t0:S.t0,t1:S.t1,l2s1:S.l2s1,
    l3i:S.l3i||0,l5i:S.l5i||0,
    savedAt:Date.now()
  };
  try{localStorage.setItem(lsKey(S.g.n),JSON.stringify(safe));}
  catch(e){console.warn('Save failed:',e);}
}

function loadGame(name){
  try{
    const raw=localStorage.getItem(lsKey(name));
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}

function deleteGame(name){
  try{localStorage.removeItem(lsKey(name));}catch(e){}
}

function safeScr(scr){
  // Always resume at level intro, never mid-exercise
  const m={l1q1:'l1i',l1q2:'l1i',l2vf:'l2i',l2qm:'l2i',l2fl:'l2i',l3or:'l3i',l4e1:'l4i',l4e2:'l4i',l5or:'l5i'};
  return m[scr]||scr;
}

const LVL_NAMES={
  home:'Accueil',rules:'Règles',grp:'Identification',
  l1i:'Mission 1',l1q1:'Mission 1',l1q2:'Mission 1',l1d:'Mission 1 ✓',
  l2i:'Mission 2',l2vf:'Mission 2',l2qm:'Mission 2',l2fl:'Mission 2',l2d:'Mission 2 ✓',
  l3i:'Mission 3',l3or:'Mission 3',l3d:'Mission 3 ✓',
  l4i:'Mission 4',l4e1:'Mission 4',l4e2:'Mission 4',l4d:'Mission 4 ✓',
  l5i:'Mission 5',l5or:'Mission 5',l5d:'Mission 5 ✓',
  fin:'Code Final',vic:'Victoire !'
};

/* ═══════════════════════════════════
   NAVIGATION
═══════════════════════════════════ */
function go(scr,ei={}){
  if(scr!=='rep')S.prevScr=S.scr;
  E=ei;S.scr=scr;
  saveGame();
  render();
  window.scrollTo(0,0);
}

function render(){
  document.getElementById('app').innerHTML=view();
}

/* ═══════════════════════════════════
   PDF GENERATION
═══════════════════════════════════ */
function openPDF(){
  const dur=S.t1?fmt(S.t0,S.t1):(S.t0?'En cours':'—');
  const pmax=350;
  const pct=Math.min(100,Math.round((S.pts/pmax)*100));
  const medal=pct>=85?'🥇':pct>=65?'🥈':pct>=45?'🥉':'🎯';
  const parts=(S.g.p||[]).map(p=>`<span style="background:#FF9F43;color:#fff;padding:3px 9px;border-radius:50px;font-size:.79rem;font-weight:700;margin:2px;display:inline-block">${p.fn}-${p.ln}</span>`).join(' ');

  /* ── Point breakdown ── */
  const r=S.res;
  const pRows=[
    r['L1-Ex1']?{label:'M1 — Vocabulaire Ex.1',score:r['L1-Ex1'].score,passed:r['L1-Ex1'].passed,pts:r['L1-Ex1'].passed?50:0}:{},
    r['L1-Ex2']?{label:'M1 — Vocabulaire Rattrapage',score:r['L1-Ex2'].score,passed:r['L1-Ex2'].passed,pts:r['L1-Ex2'].passed?50:0}:null,
    r['L2-VF']?{label:'M2 — Lecture V/F',score:r['L2-VF'].score,passed:r['L2-VF'].passed,pts:null}:null,
    r['L2-QCM']?{label:'M2 — Lecture QCM',score:r['L2-QCM'].score,passed:r['L2-QCM'].passed,pts:(r['L2-VF']?.passed&&r['L2-QCM']?.passed)?100:-25}:null,
    r['L3-Oral']?{label:'M3 — Expression orale',score:null,oral:true,passed:r['L3-Oral'].passed,pts:r['L3-Oral'].passed?50:0}:null,
    r['L4-Ex1']?{label:'M4 — Correspondance Ex.1',score:r['L4-Ex1'].score,passed:r['L4-Ex1'].passed,pts:r['L4-Ex1'].passed?50:0}:null,
    r['L4-Ex2']?{label:'M4 — Correspondance Rattrapage',score:r['L4-Ex2'].score,passed:r['L4-Ex2'].passed,pts:r['L4-Ex2'].passed?50:0}:null,
    r['L5-Oral']?{label:'M5 — Compte rendu oral',score:null,oral:true,passed:r['L5-Oral'].passed,pts:r['L5-Oral'].passed?50:0}:null
  ].filter(Boolean).filter(x=>Object.keys(x).length);
  const ptTableRows=pRows.map(x=>{
    const scoreStr=x.score!=null?`${x.score}/10`:x.oral?'Oral':'—';
    const ptsStr=x.pts===null?'(inclus)':x.pts>0?`+${x.pts} pts`:x.pts<0?`${x.pts} pts pénalité`:'0 pt';
    const bg=x.pts===null?'#F9F9F9':x.pts>0?'#EDF9EF':x.pts<0?'#FFF0F0':'#FFF8EE';
    const sc=x.pts===null?'#888':x.pts>0?'#1A7A27':x.pts<0?'#9A1A1A':'#888';
    return `<tr style="background:${bg}">

function doRestart(){

/* QCM */
function vQCM(){
  const{qs,cur=0,ans={},done=false}=E;
  if(!qs)return'';
  const q=qs[cur];const L='ABCD';const CC=['#FF6B6B','#4ECDC4','#FFD93D','#C77DFF'];
  const dots=qs.map((_,i)=>{
    const c=done?(ans[i]===qs[i].c?'#6BCB77':'#FF6B6B'):(ans[i]!=null?'#4ECDC4':'#DDD');
    return`<div onclick="E.cur=${i};render()" style="width:9px;height:9px;border-radius:50%;background:${c};cursor:pointer;display:inline-block;margin:2px"></div>`;
  }).join('');
  const opts=q.o.map((opt,oi)=>{
    let extra='';
    if(ans[cur]===oi)extra='opt-sel';
    if(done&&oi===q.c)extra='opt-right';
    if(done&&ans[cur]===oi&&oi!==q.c)extra='opt-wrong';
    const lbg=ans[cur]===oi?CC[oi]:'#F0F0F0',lc=ans[cur]===oi?'#fff':'#999';
    const mk=done?(oi===q.c?' ✓':(ans[cur]===oi?' ✗':'')):'';
    return`<div class="opt ${extra}" onclick="${done?'':(`E.ans[${cur}]=${oi};render()`)}">
      <div class="let" style="background:${lbg};color:${lc}">${L[oi]}</div>
      <span style="flex:1">${opt}</span>
      <span style="font-weight:800;color:${done&&oi===q.c?'#6BCB77':'#FF6B6B'}">${mk}</span>
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const bot=done
    ?`<div style="width:100%">${achvBanner(score)}<div style="display:flex;gap:8px"><div class="${pass(score)?'ok':'ko'}" style="flex:1;margin:0">${score}/${qs.length} ${pass(score)?'✓ Réussi !':'✗ Insuffisant'}</div>${B('Continuer →','qcmDone()','teal')}</div></div>`
    :(allA?B('✅ Valider mes réponses','E.done=true;render()','coral'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(ans).length}/${qs.length} répondues</small>`);
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="color:#AAA;font-size:.8rem;font-weight:700">Question ${cur+1}/${qs.length}</span>
      <div>${dots}</div>
    </div>
    <div style="background:#FFF8EE;border-radius:10px;padding:12px;margin-bottom:11px;font-weight:600;font-size:.9rem;line-height:1.5">${q.q}</div>
    ${opts}
    <div style="display:flex;gap:7px;margin-top:11px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${cur>0?B('← Préc.',`E.cur=${cur-1};render()`,'gray',false,true):''}
        ${cur<qs.length-1?B('Suiv. →',`E.cur=${cur+1};render()`,'teal',false,true):''}
      </div>${bot}
    </div>
  </div>`;
}
function qcmDone(){
  const{qs,ans={},lbl=''}=E;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const wrong=qs.flatMap((q,i)=>ans[i]!==q.c?[{level:lbl,question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c]}]:[]);
  S.wr.push(...wrong);
  S.allAns.push(...qs.map((q,i)=>({level:lbl,question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c],ok:ans[i]===q.c})));
  if(S.scr==='l1q1'){S.res['L1-Ex1']={score,passed:pass(score)};if(pass(score)){S.pts+=50;go('l1d');}else go('l1q2',{qs:Q2,cur:0,ans:{},done:false,lbl:'L1-Ex2'});}
  else if(S.scr==='l1q2'){S.res['L1-Ex2']={score,passed:pass(score)};if(pass(score))S.pts+=50;go('l1d');}
  else if(S.scr==='l2qm'){
    S.res['L2-QCM']={score,passed:pass(score)};
    if(pass(S.l2s1)&&pass(score)){S.pts+=100;go('l2d');}
    else{S.pts=Math.max(0,S.pts-25);go('l2fl');}
  }
}

/* MATCHING */
function vMatch(){
  const{ps,sh,sel,mt={},done=false}=E;if(!ps)return'';
  const used=Object.values(mt);
  const words=ps.map((p,i)=>{
    const isM=mt[i]!=null,ok=done&&mt[i]===i,ko=done&&isM&&mt[i]!==i;
    const cl=`mi${sel===i?' mi-sel':''}${isM&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}`;
    return`<div class="${cl}" onclick="${done||isM?'':(`selW(${i})`)}">
      <strong style="flex:1">${p.w}</strong>
      ${isM&&!done?'<span style="color:#C77DFF;font-size:.72rem">✓</span>':''}
      ${ok?'<span style="color:#6BCB77">✓</span>':''}${ko?'<span style="color:#FF6B6B">✗</span>':''}
    </div>`;
  }).join('');
  const defs=sh.map(orig=>{
    const isU=used.includes(orig);
    const mKey=Object.keys(mt).find(k=>mt[k]===orig);
    const ok=done&&mKey!=null&&Number(mKey)===orig;
    const ko=done&&isU&&!ok;
    const cl=`mi${isU&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}`;
    return`<div class="${cl}" onclick="${isU?'':(`selD(${orig})`)}">${ps[orig].d}</div>`;
  }).join('');
  const allM=Object.keys(mt).length===ps.length;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const bot=done
    ?`<div style="width:100%">${achvBanner(score)}<div style="display:flex;gap:8px"><div class="${pass(score)?'ok':'ko'}" style="flex:1;margin:0">${score}/${ps.length} ${pass(score)?'✓ Réussi !':'✗ Insuffisant'}</div>${B('Continuer →','matchDone()','teal')}</div></div>`
    :(allM?B('✅ Valider','E.done=true;render()','coral'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(mt).length}/${ps.length} associés</small>`);
  return`<p style="color:#AAA;font-size:.8rem;margin-bottom:9px;font-weight:700">① Cliquez un mot → ② Cliquez sa définition</p>
  <div class="mg"><div><div style="font-weight:800;color:#C77DFF;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Mots</div>${words}</div>
  <div><div style="font-weight:800;color:#FF9F43;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Définitions</div>${defs}</div></div>
  <div style="margin-top:12px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function selW(i){if(E.done||E.mt[i]!=null)return;E.sel=E.sel===i?null:i;render();}
function selD(orig){if(E.done||Object.values(E.mt||{}).includes(orig)||E.sel==null)return;if(!E.mt)E.mt={};E.mt[E.sel]=orig;E.sel=null;render();}
function matchDone(){
  const{ps,mt={},lbl=''}=E;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const wrong=ps.flatMap((p,i)=>mt[i]!==i?[{level:lbl,question:p.w,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d}]:[]);
  S.wr.push(...wrong);
  S.allAns.push(...ps.map((p,i)=>({level:lbl,question:p.w,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d,ok:mt[i]===i})));
  if(S.scr==='l4e1'){S.res['L4-Ex1']={score,passed:pass(score)};if(pass(score)){S.pts+=50;go('l4d');}else go('l4e2',{ps:M2,sh:shuf(M2.map((_,i)=>i)),sel:null,mt:{},done:false,lbl:'L4-Ex2'});}
  else{S.res['L4-Ex2']={score,passed:pass(score)};if(pass(score))S.pts+=50;go('l4d');}
}

      <h2 style="font-size:1.7rem;font-weight:800;color:#FF6B6B;margin-top:7px">Code Final</h2>
      <p style="color:#888;font-size:.88rem;margin-top:4px">Recomposez la phrase secrète avec vos 5 fragments</p>
    </div>
    <div style="background:#FFF8EE;border-radius:12px;padding:15px;margin-bottom:17px">
      <div style="font-weight:800;color:#FF9F43;margin-bottom:9px">🧩 Vos fragments :</div>
      <div style="margin-bottom:7px">${chips}</div>
      <p style="color:#AAA;font-size:.77rem;font-style:italic">⚠️ Ils sont dans le désordre — trouvez la bonne phrase !</p>
    </div>
    <label style="font-weight:700;display:block;margin-bottom:7px;font-size:.89rem">✍️ Entrez la phrase complète :</label>
    <input id="fc" type="text" placeholder="_ _ _ _ _ _ _ _ _ _ _ _ _" style="font-size:.98rem;text-align:center;letter-spacing:.04em;margin-bottom:9px" onkeydown="if(event.key==='Enter')checkFinal()">
    <div id="fe" style="color:#FF6B6B;font-weight:700;font-size:.82rem;min-height:16px;margin-bottom:10px"></div>
    <div style="text-align:center">${B('🔓 Ouvrir le Sunshine Playroom !','checkFinal()','coral',false,false)}</div>
  </div>`;
}
function checkFinal(){
  const v=((document.getElementById('fc')||{}).value||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(v==='WE PLAY AND LEARN TOGETHER'){S.t1=Date.now();go('vic');}
  else{const e=document.getElementById('fe');if(e)e.textContent=`❌ Code incorrect. Réarrangez vos ${S.rv.length} fragments !`;}
}

/* VICTORY */
function vVictory(){
  const dur=fmt(S.t0,S.t1);
  const parts=(S.g.p||[]).map(p=>`<span class="chip">${p.fn}-${p.ln}</span>`).join(' ');
  return`<div style="background:linear-gradient(135deg,#FF6B6B,#FF9F43,#4ECDC4);border-radius:18px;padding:30px;text-align:center;color:#fff;margin-bottom:16px">
    <div style="font-size:2.8rem;margin-bottom:8px">🎉🏆🎊</div>
    <h1 style="font-size:1.9rem;font-weight:900;margin-bottom:7px">Mission accomplie !</h1>
    <p style="opacity:.9;margin-bottom:4px">Le Sunshine Playroom est sauvé ! 🌈</p>
    <div style="font-weight:900;font-size:1.15rem;margin-top:13px;background:rgba(255,255,255,.2);padding:9px 20px;border-radius:50px;display:inline-block">WE PLAY AND LEARN TOGETHER ✓</div>
  </div>
  <div class="card">
    <div style="font-weight:800;color:#FF9F43;margin-bottom:12px;font-size:.9rem">📊 Résumé</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div style="background:#FFF8EE;padding:13px;border-radius:12px;text-align:center"><div style="font-size:1.9rem;font-weight:900;color:#FF6B6B">${S.pts}</div><div style="color:#888;font-size:.8rem">Points</div></div>
      <div style="background:#FFF8EE;padding:13px;border-radius:12px;text-align:center"><div style="font-size:1.4rem;font-weight:800;color:#4ECDC4">${dur}</div><div style="color:#888;font-size:.8rem">Durée</div></div>
    </div>
    <div style="margin-bottom:14px"><div style="font-weight:700;font-size:.88rem;margin-bottom:6px">👥 Équipe : <span style="color:#FF6B6B">${S.g.n}</span></div><div>${parts}</div></div>
    ${B('📄 Télécharger le rapport PDF','openPDF()','orange',true)}
  </div>`;
}

/* RGPD */
function vRGPD(){
  return`<div style="min-height:100vh;padding:18px 16px 36px"><div style="max-width:580px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-top:8px">
      <span style="color:#AAA;cursor:pointer;font-size:.82rem;font-weight:700" onclick="go('home')">← Retour</span>
    </div>
    <div style="background:linear-gradient(135deg,#4ECDC4,#45B7D1);border-radius:16px;padding:24px;text-align:center;color:#fff;margin-bottom:16px">
      <div style="font-size:2.3rem;margin-bottom:7px">🔒</div>
      <h1 style="font-weight:800;font-size:1.5rem;margin-bottom:4px">Protection des données personnelles</h1>
      <p style="opacity:.8;font-size:.82rem">Sunshine Playroom Escape Game — Bac Pro AEPA</p>
    </div>
    <div class="card" style="border-left:4px solid #4ECDC4;margin-bottom:10px">
      <p style="color:#333;font-size:.9rem;line-height:1.82">Cette application est un outil pédagogique développé pour un usage en classe.</p>
    </div>
    <div style="display:grid;gap:9px;margin-bottom:16px">
      <div class="card" style="padding:14px 15px"><p style="color:#333;font-size:.88rem;line-height:1.82">Aucune donnée n'est transmise à un serveur externe : toutes les informations (identifiant, réponses, score) restent uniquement dans la mémoire de votre navigateur, le temps de la partie en cours.</p></div>
      <div class="card" style="padding:14px 15px"><p style="color:#333;font-size:.88rem;line-height:1.82">Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.</p></div>
      <div class="card" style="padding:14px 15px"><p style="color:#333;font-size:.88rem;line-height:1.82">Les seules données saisies sont : les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices.</p></div>
      <div class="card" style="padding:14px 15px"><p style="color:#333;font-size:.88rem;line-height:1.82">Votre progression (identifiant, réponses, score) est enregistrée localement dans la mémoire de stockage de votre navigateur (localStorage), sur cet appareil uniquement, afin de vous permettre de reprendre la partie lors d'une prochaine séance. Ces données ne sont jamais transmises à un serveur ni à un tiers. Vous pouvez les supprimer à tout moment en choisissant « Recommencer à zéro » sur l'écran d'identification, ou en effaçant les données de navigation de votre navigateur.</p></div>
      <div class="card" style="padding:14px 15px"><p style="color:#333;font-size:.88rem;line-height:1.82">Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur.</p></div>
    </div>
  </div></div>`;
}

/* ═══════════════════════════════════
   ROUTER
═══════════════════════════════════ */
function view(){
  const sc=S.scr;
  if(sc==='home')return vHome();
  if(sc==='rules')return vRules();
  if(sc==='rgpd')return vRGPD();
  if(sc==='tlg')return vLogin('Interface Professeur','tdb');
  if(sc==='tdb')return vTeacher();
  if(sc==='slg')return vLogin('Connexion Équipe','grp');
  if(sc==='grp')return vGroup();
  // Level screens
  const H=wrap;
  if(sc==='l1i')return H(lvlIntro('📝','Mission 1 — Induction Room','Vocabulaire de l\'animation','<p style="font-weight:700;margin-bottom:7px">Welcome to the Sunshine Playroom!</p><p style="color:#666;font-size:.88rem;line-height:1.72">Avant d\'entrer dans la salle, prouvez que vous maîtrisez le vocabulaire de l\'animation et de la petite enfance. 10 questions · Seuil ≥ 8/10 · Exercice de rattrapage si échec.</p>',"go('l1q1',{qs:Q1,cur:0,ans:{},done:false,lbl:'L1-Ex1'})"),1);
  if(sc==='l1q1')return H(`<div class="card"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><span style="background:#FF6B6B;color:#fff;padding:3px 11px;border-radius:50px;font-weight:800;font-size:.79rem">Ex. 1</span><strong>QCM — Vocabulaire</strong></div>${vQCM()}</div>`,1);
  if(sc==='l1q2')return H(`<div class="ko" style="margin-bottom:11px">💪 Score insuffisant — exercice de rattrapage !</div><div class="card"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><span style="background:#FF9F43;color:#fff;padding:3px 11px;border-radius:50px;font-weight:800;font-size:.79rem">Rattrapage</span><strong>QCM — Vocabulaire (2)</strong></div>${vQCM()}</div>`,1);
  if(sc==='l1d')return H(indiceBlock(0)+`<div style="text-align:center;margin-top:10px">${B('Mission suivante →',"go('l2i')",'yellow',false,false)}</div>`,1);
  if(sc==='l2i')return H(lvlIntro('📖','Mission 2 — Intelligence Desk','Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">Un rapport a été retrouvé dans la salle !</p><p style="color:#666;font-size:.88rem;line-height:1.72">Deux textes décrivent la journée au Sunshine Playroom. Lisez-les et répondez aux questions. Les <strong>2 exercices sont obligatoires</strong>.</p><p style="color:#FF6B6B;font-weight:700;font-size:.84rem;margin-top:7px">⚠️ ≥ 8/10 aux deux pour avancer · Échec = −25 pts + retour Mission 1</p>',"go('l2vf',{qs:VF,text:T1,ans:{},done:false})"),2);
  if(sc==='l2vf')return H(`<div class="card"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><span style="background:#4ECDC4;color:#fff;padding:3px 11px;border-radius:50px;font-weight:800;font-size:.79rem">Ex. 1/2</span><strong>Vrai / Faux</strong></div>${vVF()}</div>`,2);
  if(sc==='l2qm')return H(`<div class="card"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><span style="background:#4ECDC4;color:#fff;padding:3px 11px;border-radius:50px;font-weight:800;font-size:.79rem">Ex. 2/2</span><strong>QCM — Afternoon</strong></div><div class="rtxt"><strong style="color:#FF9F43;font-style:normal">📄 Afternoon at the Sunshine Playroom</strong><br><br>${T2.replace(/\n\n/g,'<br><br>')}</div>${vQCM()}</div>`,2);
  if(sc==='l2fl')return H(`<div class="card" style="text-align:center;padding:28px 18px"><div style="font-size:2.3rem;margin-bottom:8px">😅</div><h2 style="color:#FF6B6B;font-weight:800;margin-bottom:10px">Score insuffisant</h2><p style="color:#666;margin-bottom:13px;font-size:.9rem">≥ 80% requis aux deux exercices pour avancer.</p><div class="ko" style="margin-bottom:20px">−25 points appliqués · Retour Mission 1</div>${B('🔄 Retour Mission 1',"go('l1i')",'coral',false,false)}</div>`,2);
  if(sc==='l2d')return H(indiceBlock(1)+`<div style="text-align:center;margin-top:10px">${B('Mission suivante →',"go('l3i')",'yellow',false,false)}</div>`,2);
  if(sc==='l3i')return H(lvlIntro('🎤','Mission 3 — Situation Room','Expression orale','<p style="font-weight:700;margin-bottom:7px">Un enfant a besoin d\'aide !</p><p style="color:#666;font-size:.88rem;line-height:1.72">Un membre de l\'équipe est tiré au sort. Il lit la carte et intervient immédiatement en anglais — sans notes, sans préparation.</p><p style="color:#888;font-size:.84rem;margin-top:7px;font-style:italic">⚠️ No notes. No preparation. Use your own words!</p>',"go('l3or',{step:'card'});S.l3i=0"),3);
  if(sc==='l3or')return H(vOral(SIT[S.l3i||0]),3);
  if(sc==='l3d')return H(indiceBlock(2)+`<div style="text-align:center;margin-top:10px">${B('Mission suivante →',"go('l4i')",'yellow',false,false)}</div>`,3);
  if(sc==='l4i')return H(lvlIntro('🔗','Mission 4 — The Programme Room','Correspondance terminologique','<p style="font-weight:700;margin-bottom:7px">Les fiches du programme sont mélangées !</p><p style="color:#666;font-size:.88rem;line-height:1.72">Associez chaque terme professionnel de l\'animation à sa définition exacte. ⏱ 6 minutes recommandées · Seuil ≥ 8/10.</p>',"go('l4e1',{ps:M1,sh:shuf(M1.map((_,i)=>i)),sel:null,mt:{},done:false,lbl:'L4-Ex1'})"),4);
  if(sc==='l4e1')return H(`<div class="card"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><span style="background:#C77DFF;color:#fff;padding:3px 11px;border-radius:50px;font-weight:800;font-size:.79rem">Ex. 1</span><strong>Correspondance — Série 1</strong></div>${vMatch()}</div>`,4);
  if(sc==='l4e2')return H(`<div class="ko" style="margin-bottom:11px">💪 Rattrapage — nouvelle série !</div><div class="card"><div style="display:flex;gap:7px;align-items:center;margin-bottom:11px"><span style="background:#FF9F43;color:#fff;padding:3px 11px;border-radius:50px;font-weight:800;font-size:.79rem">Rattrapage</span><strong>Correspondance — Série 2</strong></div>${vMatch()}</div>`,4);
  if(sc==='l4d')return H(indiceBlock(3)+`<div style="text-align:center;margin-top:10px">${B('Mission suivante →',"go('l5i')",'yellow',false,false)}</div>`,4);
  if(sc==='l5i')return H(lvlIntro('📋',"Mission 5 — Director's Office",'Compte rendu oral','<p style="font-weight:700;margin-bottom:7px">Dernière mission — le directeur attend votre rapport !</p><p style="color:#666;font-size:.88rem;line-height:1.72">Lisez la fiche d\'incident et présentez un compte rendu structuré en anglais. Who / What / When / Action / Result.</p><p style="color:#888;font-size:.84rem;margin-top:7px;font-style:italic">⚠️ No notes. Professional language required.</p>',"go('l5or',{step:'card'});S.l5i=0"),5);
  if(sc==='l5or')return H(vOral(REP[S.l5i||0],true),5);
  if(sc==='l5d')return H(indiceBlock(4)+`<div style="text-align:center;margin-top:10px">${B('Entrer le Code Final →',"go('fin')",'yellow',false,false)}</div>`,5);
  if(sc==='fin')return H(vFinal(),5);
  if(sc==='vic')return H(vVictory(),5);
  return'<p style="padding:20px">Écran inconnu</p>';
}

render();
</script>
